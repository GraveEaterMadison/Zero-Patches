name: ⭐ Feature request
description: Suggest a new patch or an improvement to an existing patch.
title: "feat: "
labels: ["Feature request"]
body:
  - type: markdown
    attributes:
      value: |
        # Zero Patches feature request

        Search [existing feature requests](https://github.com/GraveEaterMadison/Zero-Patches/issues?q=label%3A%22Feature+request%22) before submitting.
  - type: textarea
    attributes:
      label: Feature description
      description: Describe the patch or improvement you would like to see.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Motivation and use case
      description: Explain why this would be useful and how it would work.
    validations:
      required: true
  - type: textarea
    attributes:
      label: App details
      description: Include the app name, package name, and version if known.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I checked that this is not a duplicate request.
          required: true
