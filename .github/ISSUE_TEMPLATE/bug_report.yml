name: 🐞 Bug report
description: Report a bug in a Zero Patches release.
title: "bug: "
labels: ["Bug report"]
body:
  - type: markdown
    attributes:
      value: |
        # Zero Patches bug report

        Before submitting, search [existing bug reports](https://github.com/GraveEaterMadison/Zero-Patches/issues?q=label%3A%22Bug+report%22) to avoid duplicates.
        Please report issues specific to this patch bundle. For issues with Morphe itself, use the [Morphe project](https://github.com/MorpheApp).
  - type: textarea
    attributes:
      label: Bug description
      description: Describe the problem and include steps to reproduce it.
    validations:
      required: true
  - type: textarea
    attributes:
      label: App and patch details
      description: Include the affected app name, app version, patch name, and patch version.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Error logs
      description: Relevant logcat output or exception traces.
      render: shell
  - type: textarea
    attributes:
      label: Additional context
      description: Screenshots, videos, and any other useful information.
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I provided the app version and relevant patch details.
          required: true
